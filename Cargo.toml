[package]
name = "wreck"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Bowan Foryt <bowan@valstad.com>"]
description = "Library for collision detection of 3d shapes"
repository = "https://github.com/valstad-shipworks/wreck"

[features]
default = ["std"]
std = ["glam/std", "hydroplane/std", "aligned-vec/std", "serde?/std", "squiggle/std"]
libm = ["dep:libm", "glam/libm", "hydroplane/libm", "squiggle/libm"]
debug-wreck-assert = []
wreck-assert = []
approx = ["dep:approx", "glam/approx", "squiggle/approx"]
serde = ["dep:serde", "glam/serde", "squiggle/serde"]
quote = ["dep:quote", "dep:proc-macro2", "squiggle/quote"]
valuable = ["dep:valuable", "glam-traits-ext/Valuable", "squiggle/valuable"]

# `hp_analyze` is set by hydroplane-auto's analysis driver's rustc pass (see build.rs);
# register it so the crate-root `register_tool` and macro-emitted tool attribute don't trip
# the unexpected-cfg lint.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(hp_analyze)', 'cfg(has_quad_load)'] }

[dependencies]
glam = { version = "0.32.1", default-features = false }
approx = { version = "0.5", optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
quote = { version = "1", optional = true }
proc-macro2 = { version = "1", optional = true }
libm = { version = "0.2", optional = true }
inherent = "1.0.14"
aligned-vec = { version = "0.6.4", default-features = false }
static_assertions = "1.1.0"
valuable = { version = "0.1", default-features = false, features = ["alloc"], optional = true }
glam-traits-ext = { version = "0.32.3", default-features = false, optional = true }
squiggle = { version = "1.0.0", default-features = false }
hydroplane = { version = "0.1.0", default-features = false, features = ["alloc", "glam"] }

[build-dependencies]
hydroplane-auto = "0.1.0"

[dev-dependencies]
criterion = "0.8.2"
rand = "0.9"
wide = "1.5.0"

[[bench]]
name = "collisions"
harness = false

[[bench]]
name = "transforms"
harness = false

[[bench]]
name = "wide_vs_hydroplane"
harness = false

[[bench]]
name = "raycast"
harness = false
